<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestore Contatori</title>
  
  <!-- Collegamento PWA e Colore Barra di Stato Android -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#007bff">

  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f4f6f8; padding: 20px; display: flex; flex-direction: column; align-items: center; user-select: none; }
    h2 { margin-bottom: 15px; color: #333; }
    
    .add-bar { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 20px; }
    .add-bar input { flex: 1; padding: 10px; font-size: 1rem; border: 1px solid #ccc; border-radius: 6px; }
    .btn-add { padding: 10px 16px; font-size: 1rem; border: none; border-radius: 6px; background: #28a745; color: white; font-weight: bold; cursor: pointer; }

    .card { 
      background: white; 
      border-radius: 8px; 
      padding: 12px 16px; 
      margin-bottom: 12px; 
      width: 100%; 
      max-width: 400px; 
      box-shadow: 0 2px 6px rgba(0,0,0,0.08); 
      display: flex; 
      align-items: center; 
      gap: 12px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    
    /* Stile per l'elemento durante il drag */
    .card.dragging {
      opacity: 0.5;
      transform: scale(0.98);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .drag-handle {
      cursor: grab;
      font-size: 1.4rem;
      color: #aaa;
      padding: 4px 6px 4px 0;
      touch-action: none;
    }
    .drag-handle:active { cursor: grabbing; }

    .card-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-weight: 600; color: #333; word-break: break-word; }
    
    /* Nota/Data sotto al titolo */
    .card-note { 
      font-size: 0.8rem; 
      color: #6c757d; 
      outline: none;
      border-bottom: 1px dashed transparent;
      padding: 1px 2px;
      border-radius: 3px;
      user-select: text;
    }
    .card-note:focus {
      background: #e9ecef;
      border-bottom-color: #007bff;
      color: #212529;
    }

    .controls { display: flex; align-items: center; gap: 6px; }
    .btn-step { width: 36px; height: 36px; font-size: 1.2rem; border: none; border-radius: 6px; background: #007bff; color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .counter-input { width: 70px; height: 36px; text-align: center; font-size: 1.1rem; font-weight: bold; border: 1px solid #ced4da; border-radius: 6px; }
    .btn-delete { background: transparent; border: none; color: #dc3545; font-size: 1.2rem; cursor: pointer; margin-left: 4px; }
  </style>
</head>
<body>

  <h2>I Miei Contatori</h2>

  <div class="add-bar">
    <input type="text" id="nuovoTitolo" placeholder="Titolo contatore..." onkeypress="handleKeyPress(event)" />
    <button class="btn-add" onclick="aggiungiContatore()">+ Aggiungi</button>
  </div>

  <div id="app" style="width: 100%; display: flex; flex-direction: column; align-items: center;"></div>

  <script>
    const STORAGE_KEY = 'app_contatori_data_v2';
    
    // Inizializzazione dati
    let contatori = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [
      { id: 1, titolo: 'Flessioni', nota: 'Aggiungi nota o data...', valore: 10 }
    ];

    function salvaStato() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(contatori));
    }

    function modificaPulsante(id, delta) {
      contatori = contatori.map(c => c.id === id ? { ...c, valore: Number(c.valore) + delta } : c);
      salvaStato();
      render();
    }

    function modificaDiretta(id, nuovoValoreTesto) {
      const valoreNumerico = parseInt(nuovoValoreTesto, 10);
      contatori = contatori.map(c => c.id === id ? { ...c, valore: isNaN(valoreNumerico) ? 0 : valoreNumerico } : c);
      salvaStato();
    }

    function modificaNota(id, nuovaNota) {
      contatori = contatori.map(c => c.id === id ? { ...c, nota: nuovaNota } : c);
      salvaStato();
    }

    function aggiungiContatore() {
      const inputTitolo = document.getElementById('nuovoTitolo');
      const titolo = inputTitolo.value.trim();
      if (!titolo) return;

      contatori.push({ 
        id: Date.now(), 
        titolo: titolo, 
        nota: 'Aggiungi nota...', 
        valore: 0 
      });
      salvaStato();
      inputTitolo.value = '';
      render();
    }

    function rimuoviContatore(id) {
      contatori = contatori.filter(c => c.id !== id);
      salvaStato();
      render();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') aggiungiContatore();
    }

    // Gestione Drag & Drop
    let draggedIndex = null;

    function handleDragStart(e, index) {
      draggedIndex = index;
      e.target.closest('.card').classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
    }

    function handleDrop(e, targetIndex) {
      e.preventDefault();
      if (draggedIndex === null || draggedIndex === targetIndex) return;

      // Sposta l'elemento all'interno dell'array
      const movedItem = contatori.splice(draggedIndex, 1)[0];
      contatori.splice(targetIndex, 0, movedItem);

      salvaStato();
      render();
    }

    function handleDragEnd(e) {
      const card = e.target.closest('.card');
      if (card) card.classList.remove('dragging');
      draggedIndex = null;
    }

    function render() {
      const container = document.getElementById('app');
      container.innerHTML = '';

      if (contatori.length === 0) {
        container.innerHTML = '<p style="color: #6c757d;">Nessun contatore. Aggiungine uno!</p>';
        return;
      }

      contatori.forEach((c, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.setAttribute('draggable', 'true');
        
        // Eventi Drag & Drop
        card.ondragstart = (e) => handleDragStart(e, index);
        card.ondragover = (e) => handleDragOver(e);
        card.ondrop = (e) => handleDrop(e, index);
        card.ondragend = (e) => handleDragEnd(e);

        card.innerHTML = `
          <div class="drag-handle" title="Trascina per riordinare">☰</div>
          <div class="card-info">
            <span class="card-title">${escapeHtml(c.titolo)}</span>
            <span 
              class="card-note" 
              contenteditable="true" 
              onblur="modificaNota(${c.id}, this.innerText)"
            >${escapeHtml(c.nota || 'Aggiungi nota...')}</span>
          </div>
          <div class="controls">
            <button class="btn-step" onclick="modificaPulsante(${c.id}, -1)">-</button>
            <input type="number" class="counter-input" value="${c.valore}" oninput="modificaDiretta(${c.id}, this.value)" />
            <button class="btn-step" onclick="modificaPulsante(${c.id}, 1)">+</button>
            <button class="btn-delete" title="Elimina" onclick="rimuoviContatore(${c.id})">🗑️</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function escapeHtml(text) {
      return text ? text.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m])) : '';
    }

    render();

    // REGISTRAZIONE SERVICE WORKER
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js')
        .then(() => console.log('Service Worker Registrato'))
        .catch(err => console.error('Errore SW:', err));
    }
  </script>
</body>
</html>
